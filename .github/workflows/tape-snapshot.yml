name: Tape snapshot

# Records the live tape into the production database so the premium-history chart keeps growing
# even when nobody has the site open. Vercel Hobby crons only run daily; GitHub Actions can run every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          curl --fail --silent --show-error --max-time 120 "${auth[@]}" https://fairtape.vercel.app/api/cron/snapshot
